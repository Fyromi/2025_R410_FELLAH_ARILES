<section>
    <div>
        <ul>
            <li><h3>{{voyage.destination}}</h3></li>
            <li><p>{{voyage.description}}</p></li>
            <li><p>Dès {{voyage.prix}}€</p></li>
        </ul>
    </div>
    <button class="btn btn-danger" (click)="afficherDialogueSuppression()">Del</button>
</section>

@if (afficherSuppression) {
<app-delete-voyage [voyageSupp]="voyage" (fermerModal)="gererActionModal($event)"/>
}
